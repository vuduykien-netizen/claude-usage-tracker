# Status line for the OpenAI Codex CLI (tested on codex-cli 0.169).
# Install with `python3 install.py --codex`, or copy the two lines below into
# ~/.codex/config.toml (or $CODEX_HOME/config.toml). If your config already has
# a [tui] table, put the status_line key inside it instead of adding a second [tui].
#
# Codex draws its status line itself from built-in items, so no script runs.
# Order: project folder, model + reasoning, context used, weekly limit, 5-hour limit.
# Codex leaves out an item when it has no data. Change it for one session with /statusline.

[tui]
status_line = ["project-name", "model-with-reasoning", "context-used", "weekly-limit", "five-hour-limit"]
